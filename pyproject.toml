[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "credit-card-fraud-pipeline"
version = "1.0.0"
description = "Leakage-safe credit-card fraud detection pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MostafaK66" }]
dependencies = [
  "imbalanced-learn>=0.13,<1",
  "numpy>=1.26,<2.3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.5,<2",
  "skops>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.27",
  "mypy>=1.15",
  "pandas-stubs>=2.1",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[project.scripts]
fraud-detect = "credit_fraud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_fraud"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["imblearn.*", "sklearn.*", "skops.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov-branch --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["credit_fraud"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
